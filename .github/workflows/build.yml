name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net10.0
          - os: windows-latest
            rid: win-x64
            tfm: net10.0
          - os: macos-latest
            rid: osx-arm64
            tfm: net10.0-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/EcoFlowMonitor.App/EcoFlowMonitor.App.csproj -r ${{ matrix.rid }}

      - name: Build
        run: >-
          dotnet build src/EcoFlowMonitor.App/EcoFlowMonitor.App.csproj
          -c Release
          -f ${{ matrix.tfm }}
          -r ${{ matrix.rid }}
          --no-restore
