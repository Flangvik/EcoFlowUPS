name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net10.0
          - os: windows-latest
            rid: win-x64
            tfm: net10.0-windows10.0.19041.0
          - os: macos-latest
            rid: osx-arm64
            tfm: net10.0-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pin Xcode 26.2 on macOS runners. Xcode 26.3 on macos-latest ships with a
      # stub MacOSX.sdk that fails `xcodebuild -sdk <path> -find install_name_tool`
      # (see actions/runner-images#13743). 26.2 has the same macOS SDK per the
      # dotnet/macios 26.2.10217 release notes, and it's installed fully on the
      # runner image.
      - name: Setup Xcode 26.2 (macOS only)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # `dotnet workload restore` reads the csproj/global.json and picks the
      # matching workload version. `dotnet workload install macos` has a CDN
      # cache bug (dotnet/maui#34295) that pulls a newer manifest requiring
      # Xcode 26.3, so we avoid it.
      - name: Restore workloads (macOS only)
        if: runner.os == 'macOS'
        run: dotnet workload restore src/EcoFlowMonitor.App/EcoFlowMonitor.App.csproj

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: >-
          dotnet build src/EcoFlowMonitor.App/EcoFlowMonitor.App.csproj
          -c Release
          -f ${{ matrix.tfm }}
          -r ${{ matrix.rid }}
