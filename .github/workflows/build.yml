name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net10.0
          - os: windows-latest
            rid: win-x64
            tfm: net10.0-windows10.0.19041.0
          - os: macos-latest
            rid: osx-arm64
            tfm: net10.0-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # GitHub runner images pin an older Xcode as the default; the macos
      # workload rejects it. Walk from the newest installed Xcode down until
      # we find one with a working MacOSX SDK + install_name_tool — some
      # newer previews on the image are partially installed.
      - name: Select newest usable Xcode
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          # Reverse-sort so newest is first
          CANDIDATES=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -rV)
          for xc in $CANDIDATES; do
            echo "Trying $xc..."
            sudo xcode-select -s "$xc/Contents/Developer"
            # Accept license + finish first-launch setup (idempotent)
            sudo xcodebuild -license accept >/dev/null 2>&1 || true
            sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
            # Verify the SDK + install_name_tool are actually present
            SDK=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)
            TOOL=$(xcrun --sdk macosx --find install_name_tool 2>/dev/null || true)
            if [[ -n "$SDK" && -d "$SDK" && -n "$TOOL" && -x "$TOOL" ]]; then
              echo "Selected: $xc"
              echo "  SDK:  $SDK"
              echo "  tool: $TOOL"
              xcodebuild -version
              exit 0
            fi
            echo "  rejected ($xc is incomplete)"
          done
          echo "ERROR: no usable Xcode found on this runner" >&2
          exit 1

      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Single dotnet build does restore+build atomically. Separating them and
      # passing --no-restore has bitten us: Grpc.Tools resolves native protoc
      # via properties set during restore and sometimes comes up empty when
      # restore ran in a different invocation.
      - name: Build
        run: >-
          dotnet build src/EcoFlowMonitor.App/EcoFlowMonitor.App.csproj
          -c Release
          -f ${{ matrix.tfm }}
          -r ${{ matrix.rid }}
